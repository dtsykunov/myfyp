name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build API image
        run: docker compose build api-test

      - name: Build Worker image
        run: docker compose build worker-test

      - name: Run API lint in container
        run: docker compose run --rm api-lint

      - name: Run API type checks in container
        run: docker compose run --rm api-typecheck

      - name: Run API tests in container
        run: docker compose run --rm api-test

      - name: Run Worker lint in container
        run: docker compose run --rm worker-lint

      - name: Run Worker type checks in container
        run: docker compose run --rm worker-typecheck

      - name: Run Worker tests in container
        run: docker compose run --rm worker-test

      - name: Build Chrome extension package
        run: ./extension/chrome/scripts/build.sh

      - name: Build Firefox extension package
        run: ./extension/firefox/scripts/build.sh
