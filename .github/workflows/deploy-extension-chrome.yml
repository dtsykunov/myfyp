name: Release Browser Extensions

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-browser-extensions
  cancel-in-progress: false

jobs:
  release-browser-extensions:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chrome extension package
        run: ./extension/chrome/scripts/build.sh

      - name: Build Firefox extension package
        run: ./extension/firefox/scripts/build.sh

      - name: Upload extension build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-browser-extensions
          path: |
            dist/extensions/chrome/*.zip
            dist/extensions/chrome/*.sha256
            dist/extensions/firefox/*.zip
            dist/extensions/firefox/*.sha256

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-latest
          name: myfyp browser extensions (latest)
          body: |
            Rolling release of unpacked extension build artifacts for manual installation.

            Included in this release:
            - Chrome extension package
            - Firefox extension package

            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/extensions/chrome/*.zip
            dist/extensions/chrome/*.sha256
            dist/extensions/firefox/*.zip
            dist/extensions/firefox/*.sha256
