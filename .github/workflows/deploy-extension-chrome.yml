name: Deploy Chrome Extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chrome-extension
  cancel-in-progress: false

jobs:
  chrome-extension-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension package
        run: ./extension/chrome/scripts/build.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-chrome-extension
          path: |
            dist/extensions/chrome/*.zip
            dist/extensions/chrome/*.sha256

  deploy-chrome-extension:
    runs-on: ubuntu-latest
    needs:
      - chrome-extension-build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Chrome Web Store secrets
        shell: bash
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
        run: |
          set -euo pipefail
          required=(
            CHROME_WEBSTORE_CLIENT_ID
            CHROME_WEBSTORE_CLIENT_SECRET
            CHROME_WEBSTORE_REFRESH_TOKEN
            CHROME_WEBSTORE_EXTENSION_ID
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required deployment value: ${key}" >&2
              exit 1
            fi
          done

      - name: Deploy extension to Chrome Web Store
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
          CHROME_WEBSTORE_PUBLISH_TARGET: ${{ vars.CHROME_WEBSTORE_PUBLISH_TARGET }}
        run: ./extension/chrome/scripts/deploy.sh
