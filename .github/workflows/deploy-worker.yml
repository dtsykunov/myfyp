name: Deploy Worker

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      )
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment secrets and variables
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CF_WORKER_NAME
            CF_D1_DATABASE_NAME
            CF_D1_DATABASE_ID
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required deployment value: ${key}" >&2
              exit 1
            fi
          done

      - name: Mask Cloudflare credentials in logs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          echo "::add-mask::${CLOUDFLARE_ACCOUNT_ID}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pywrangler CLI
        run: uv tool install workers-py

      - name: Render production wrangler config
        env:
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_ROUTE_PATTERN: ${{ vars.CF_ROUTE_PATTERN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: ./cloudflare/worker/scripts/render-production-wrangler.sh cloudflare/worker/wrangler.production.toml

      - name: Apply D1 migrations
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: ${{ github.workspace }}/cloudflare/worker/scripts
          MYFYP_ENABLE_PYWRANGLER_PYODIDE_PATCH: "1"
          MYFYP_PYODIDE_INDEX: https://index.pyodide.org/0.29.3
          NO_COLOR: "1"
        run: pywrangler d1 migrations apply ${{ vars.CF_D1_DATABASE_NAME }} --remote --config wrangler.production.toml

      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: ${{ github.workspace }}/cloudflare/worker/scripts
          MYFYP_ENABLE_PYWRANGLER_PYODIDE_PATCH: "1"
          MYFYP_PYODIDE_INDEX: https://index.pyodide.org/0.29.3
          NO_COLOR: "1"
        run: pywrangler deploy --config wrangler.production.toml
