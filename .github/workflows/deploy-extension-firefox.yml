name: Deploy Firefox Extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firefox-extension
  cancel-in-progress: false

jobs:
  firefox-extension-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension package
        run: ./extension/firefox/scripts/build.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-firefox-extension
          path: |
            dist/extensions/firefox/*.zip
            dist/extensions/firefox/*.sha256

  deploy-firefox-extension:
    runs-on: ubuntu-latest
    needs:
      - firefox-extension-build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate AMO secrets
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        run: |
          set -euo pipefail
          required=(
            WEB_EXT_API_KEY
            WEB_EXT_API_SECRET
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required deployment value: ${key}" >&2
              exit 1
            fi
          done

      - name: Deploy extension to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
          FIREFOX_AMO_CHANNEL: ${{ vars.FIREFOX_AMO_CHANNEL }}
        run: ./extension/firefox/scripts/deploy.sh

      - name: Upload signed Firefox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-firefox-signed
          path: dist/extensions/firefox/signed/*
          if-no-files-found: error
