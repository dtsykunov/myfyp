<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myfyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-root">
      <header class="top-header">
        <span class="brand-logo" aria-hidden="true">
          <img src="../icons/icon-32.png" alt="">
        </span>
        <h1 class="brand-title">myfyp</h1>
      </header>

      <section class="card">
        <div class="button-row">
          <button id="upload-button" class="button button-primary" type="button">Upload Snapshot</button>
        </div>
      </section>

      <section class="card">
        <h2 class="history-title">Created Links</h2>
        <div id="history-list" class="history-list"></div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <footer class="popup-footer">
        <a class="footer-link" href="https://github.com/dtsykunov/myfyp" target="_blank" rel="noopener noreferrer">Source Code</a>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
