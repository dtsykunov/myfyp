services:
  worker:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-dev.sh
    ports:
      - "8787:8787"
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/wrangler.toml:/app/cloudflare/worker/wrangler.toml:ro
      - ./cloudflare/worker/migrations:/app/cloudflare/worker/migrations:ro
      - ./.wrangler:/app/.wrangler

  worker-test:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-tests.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro

  worker-lint:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-lint.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro

  worker-typecheck:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-typecheck.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro
