<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myfyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-root">
      <header class="top-header">
        <span class="brand-logo" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="29" height="20" viewBox="0 0 29 20" focusable="false" aria-hidden="true">
            <path d="M14.4848 20C14.4848 20 23.5695 20 25.8229 19.4C27.0917 19.06 28.0459 18.08 28.3808 16.87C29 14.65 29 9.98 29 9.98C29 9.98 29 5.34 28.3808 3.14C28.0459 1.9 27.0917 0.94 25.8229 0.61C23.5695 0 14.4848 0 14.4848 0C14.4848 0 5.42037 0 3.17711 0.61C1.9286 0.94 0.954148 1.9 0.59888 3.14C0 5.34 0 9.98 0 9.98C0 9.98 0 14.65 0.59888 16.87C0.954148 18.08 1.9286 19.06 3.17711 19.4C5.42037 20 14.4848 20 14.4848 20Z" fill="#FF0033"></path>
            <path d="M19 10L11.5 5.75V14.25L19 10Z" fill="#fff"></path>
          </svg>
        </span>
        <h1 class="brand-title">
          myfyp by
          <a class="title-link" href="https://dtsykunov.com/" target="_blank" rel="noopener noreferrer">dtsykunov</a>
        </h1>
      </header>

      <section class="card">
        <p class="muted">Manual capture only. No automatic uploads.</p>
        <div class="button-row">
          <button id="upload-button" class="button button-primary" type="button">Upload Snapshot</button>
          <button id="refresh-history-button" class="button button-muted" type="button">Refresh List</button>
          <button id="clear-history-button" class="button button-muted" type="button">Clear List</button>
        </div>
      </section>

      <section class="card">
        <h2 class="history-title">Created Links</h2>
        <p class="muted history-note">
          API base URL is configurable from page console only:
          <code>window.myfyp.setApiBaseUrl("https://myfyp.link")</code>
        </p>
        <div id="history-list" class="history-list"></div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
