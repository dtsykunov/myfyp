name: Release Chrome Extension

on:
  push:
    branches:
      - main
      - master
    paths:
      - extension/chrome/**
      - .github/workflows/deploy-extension-chrome.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-chrome-extension
  cancel-in-progress: true

jobs:
  release-chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Chrome extension package
        run: ./extension/chrome/scripts/build.sh

      - name: Upload extension build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-chrome-extension
          retention-days: 7
          path: |
            dist/extensions/chrome/*.zip
            dist/extensions/chrome/*.sha256

      - name: Remove previous Chrome assets from rolling release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "extensions-latest";
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status === 404) {
                return;
              }
              throw error;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100,
            });

            const targets = assets.filter((asset) =>
              /^myfyp-chrome-.*\.(zip|sha256)$/i.test(asset.name)
            );

            for (const asset of targets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-latest
          name: myfyp chrome extension (latest)
          body: |
            Rolling release of unpacked Chrome extension build artifacts for manual installation.

            Included in this release:
            - Chrome extension package

            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/extensions/chrome/*.zip
            dist/extensions/chrome/*.sha256
