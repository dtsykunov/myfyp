name: Deploy Firefox Extension

on:
  workflow_dispatch:
    inputs:
      amo_channel:
        description: "AMO signing channel"
        type: choice
        options:
          - unlisted
          - listed
        default: unlisted

permissions:
  contents: write

concurrency:
  group: deploy-firefox-extension
  cancel-in-progress: true

jobs:
  deploy-firefox-extension:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Firefox extension package
        run: ./extension/firefox/scripts/build.sh

      - name: Publish Firefox extension to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
          FIREFOX_AMO_CHANNEL: ${{ inputs.amo_channel }}
        run: ./extension/firefox/scripts/deploy.sh

      - name: Upload Firefox extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-firefox-extension
          retention-days: 7
          path: |
            dist/extensions/firefox/*.zip
            dist/extensions/firefox/*.sha256
            dist/extensions/firefox/signed/*

      - name: Verify signed XPI exists
        run: ls -1 dist/extensions/firefox/signed/*.xpi

      - name: Remove previous Firefox assets from rolling release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "extensions-latest";
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status === 404) {
                return;
              }
              throw error;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100,
            });

            const targets = assets.filter((asset) =>
              /^myfyp-firefox-.*\.(zip|sha256)$/i.test(asset.name) || /\.xpi$/i.test(asset.name)
            );

            for (const asset of targets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Publish signed XPI to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-latest
          name: myfyp Firefox signed extension (latest)
          body: |
            Rolling release of signed Firefox extension artifacts.

            Channel: ${{ inputs.amo_channel }}
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/extensions/firefox/signed/*.xpi
            dist/extensions/firefox/*.zip
            dist/extensions/firefox/*.sha256
