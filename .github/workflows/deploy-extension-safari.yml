name: Deploy Safari Extension

on:
  push:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Run archive/export step for App Store submission"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-safari-extension
  cancel-in-progress: false

jobs:
  safari-extension-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension package
        run: ./extension/safari/scripts/build.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-safari-extension
          path: |
            dist/extensions/safari/*.zip
            dist/extensions/safari/*.sha256

  deploy-safari-extension:
    runs-on: macos-latest
    needs:
      - safari-extension-build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deploy mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          full="0"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_deploy }}" == "true" ]]; then
            full="1"
          fi
          echo "full=${full}" >> "$GITHUB_OUTPUT"

      - name: Validate full deploy secrets
        if: ${{ steps.mode.outputs.full == '1' }}
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SAFARI_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.SAFARI_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_DEVELOPMENT_TEAM
            SAFARI_EXPORT_OPTIONS_PLIST_BASE64
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required deployment value: ${key}" >&2
              exit 1
            fi
          done

      - name: Write export options plist
        if: ${{ steps.mode.outputs.full == '1' }}
        shell: bash
        env:
          SAFARI_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.SAFARI_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
import base64
import os
import pathlib

payload = os.environ["SAFARI_EXPORT_OPTIONS_PLIST_BASE64"]
path = pathlib.Path("/tmp/safari_export_options.plist")
path.write_bytes(base64.b64decode(payload))
print(f"Wrote {path}")
PY

      - name: Convert/deploy Safari extension
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SAFARI_APP_NAME: ${{ vars.SAFARI_APP_NAME }}
          SAFARI_BUNDLE_IDENTIFIER: ${{ vars.SAFARI_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.mode.outputs.full }}" == "1" ]]; then
            export SAFARI_DEPLOY_SKIP_ARCHIVE=0
            export SAFARI_EXPORT_OPTIONS_PLIST="/tmp/safari_export_options.plist"
          else
            export SAFARI_DEPLOY_SKIP_ARCHIVE=1
          fi
          ./extension/safari/scripts/deploy.sh

      - name: Upload Safari conversion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfyp-safari-xcode
          path: dist/extensions/safari/xcode/**
          if-no-files-found: error
