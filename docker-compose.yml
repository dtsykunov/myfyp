services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: for-us-api:dev
    command: ./scripts/run-api.sh
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app/src
      - ./api/tests:/app/tests
      - ./api/scripts:/app/scripts
      - ./api/pyproject.toml:/app/pyproject.toml:ro
      - ./extension/userscript:/app/extension/userscript:ro
      - ./brand/icons/web:/app/brand/icons/web:ro

  api-test:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: for-us-api:dev
    command: ./scripts/run-tests.sh

  api-lint:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: for-us-api:dev
    command: ./scripts/run-lint.sh

  api-typecheck:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: for-us-api:dev
    command: ./scripts/run-typecheck.sh

  worker-test:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-tests.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro

  worker-lint:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-lint.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro

  worker-typecheck:
    build:
      context: .
      dockerfile: cloudflare/worker/Dockerfile
    image: for-us-worker:dev
    command: ./cloudflare/worker/scripts/run-typecheck.sh
    volumes:
      - ./cloudflare/worker/src:/app/cloudflare/worker/src
      - ./cloudflare/worker/tests:/app/cloudflare/worker/tests
      - ./cloudflare/worker/scripts:/app/cloudflare/worker/scripts
      - ./cloudflare/worker/pyproject.toml:/app/cloudflare/worker/pyproject.toml:ro
